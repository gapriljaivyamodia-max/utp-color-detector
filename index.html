<script>

const camera =
document.getElementById("camera");

const result =
document.getElementById("result");

async function startCamera() {
    const result = document.getElementById("result");
    const camera = document.getElementById("camera");

    try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("Camera API is not available");
        }

        result.innerHTML = "📷 Requesting camera access...";

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            },
            audio: false
        });

        camera.srcObject = stream;
        camera.autoplay = true;
        camera.playsInline = true;
        camera.muted = true;

        await camera.play();

        result.style.color = "green";
        result.innerHTML =

startCamera();


// ACTUAL CAMERA SCAN
function checkCable() {
    const video = document.querySelector("video");

    if (!camera.videoWidth || !camera.videoHeight) {
        result.innerHTML = "❌ Camera is not ready.";
        return;
    }

    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;

    ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);

    result.style.color = "black";
    result.innerHTML =
        "🔍 SCANNING...<br><br>" +
        "Analyzing the 8 wire positions...";

    const boxes = document.querySelectorAll(".wire");

    // Temporary detection test:
    // Read the color from the center area of each wire position.
    boxes.forEach((box, index) => {
        const x = canvas.width * (0.20 + index * 0.085);
        const y = canvas.height * 0.50;

        const pixel = ctx.getImageData(
            Math.floor(x),
            Math.floor(y),
            1,
            1
        ).data;

        box.textContent =
            `${index + 1}: RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
    });

    result.innerHTML =
        "🟢 SCAN COMPLETE<br><br>" +
        "Camera image captured successfully.";
}


    canvas.width = videoWidth;
    canvas.height = videoHeight;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(
        camera,
        0,
        0,
        videoWidth,
        videoHeight
    );


    // The 8 wires are expected to be arranged horizontally.
    // We sample 8 positions across the center of the camera.

    const y = Math.floor(videoHeight * 0.50);

    const detectedColors = [];


    for (let i = 0; i < 8; i++) {

        const x = Math.floor(
            videoWidth * ((i + 0.5) / 8)
        );


        // Read a small area around each wire
        const sampleSize = 12;

        const imageData = ctx.getImageData(
            Math.max(0, x - sampleSize),
            Math.max(0, y - sampleSize),
            sampleSize * 2,
            sampleSize * 2
        );


        const color = detectColor(imageData.data);

        detectedColors.push(color);
    }


    // Show detected results

    boxes.forEach((box, index) => {

        box.textContent = detectedColors[index];

        box.style.background =
            getColorDisplay(detectedColors[index]);

    });


    // Compare with T568B

    let correct = true;

    for (let i = 0; i < 8; i++) {

        if (detectedColors[i] !== colors[i]) {

            correct = false;

        }

    }


    if (correct) {

        result.style.color = "green";

        result.innerHTML =
            "✅ CORRECT CABLE ORDER!<br><br>" +
            "The detected wires match T568B.";

    } else {

        result.style.color = "red";

        result.innerHTML =
            "❌ COLOR ORDER DOES NOT MATCH T568B.<br><br>" +
            "Check the wire positions.";

    }

}


// Detect basic wire color from camera pixels
function detectColor(data) {

    let red = 0;
    let green = 0;
    let blue = 0;

    let count = 0;


    for (let i = 0; i < data.length; i += 4) {

        red += data[i];
        green += data[i + 1];
        blue += data[i + 2];

        count++;

    }


    red /= count;
    green /= count;
    blue /= count;


    // White
    if (
        red > 150 &&
        green > 150 &&
        blue > 150
    ) {

        return "White";

    }


    // Orange
    if (
        red > green * 1.25 &&
        red > blue * 1.5
    ) {

        return "Orange";

    }


    // Green
    if (
        green > red * 1.15 &&
        green > blue * 1.1
    ) {

        return "Green";

    }


    // Blue
    if (
        blue > red * 1.25 &&
        blue > green * 1.1
    ) {

        return "Blue";

    }


    // Brown
    if (
        red > blue * 1.2 &&
        red > green * 1.05 &&
        green > blue * 1.1
    ) {

        return "Brown";

    }


    return "Unknown";

}
